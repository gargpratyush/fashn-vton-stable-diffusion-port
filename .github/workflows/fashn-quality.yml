name: FASHN quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fashn-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned GGML
        run: git submodule update --init ggml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fast Python dependencies
        run: python -m pip install -r scripts/requirements-fashn-tests.txt
      - name: Configure CPU without optional SDKs
        run: >-
          cmake -S . -B build-quality -DSD_BUILD_TESTS=ON -DSD_BUILD_EXAMPLES=ON
          -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_FASHN_PREPROCESS=OFF
          -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_BLAS=OFF -DGGML_LLAMAFILE=OFF
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build-quality --config Release --parallel 2
      - name: Native fast tests
        run: ctest --test-dir build-quality -C Release -L fast --output-on-failure --no-tests=error
      - name: Python contracts (optional fixture tests explicitly skipped)
        run: python scripts/run_fashn_fast_tests.py
      - name: UI contracts
        run: node --test scripts/test_fashn_vton_ui.cjs
      - name: Install native analysis tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang-tidy-19
      - name: Analyze new reliability boundaries
        if: runner.os == 'Linux'
        run: >-
          clang-tidy-19 -p build-quality src/core/api_boundary.cpp
          src/runtime/fashn_try_on.cpp --warnings-as-errors='*'
      - name: Encoder sanitizers
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -fsanitize=address,undefined -fno-sanitize-recover=all -I. tests/test_fashn_base64.cpp -o build-quality/base64-sanitized
          build-quality/base64-sanitized
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-test-log-${{ matrix.os }}
          path: build-quality/Testing/Temporary/
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned formatter major
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format-19
      - name: Check changed owned lines
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=e86c564fd42d876b30befcaf4a782e437f0fe134
          fi
          python3 scripts/format_code.py --check --base "$base" --formatter clang-format-19
